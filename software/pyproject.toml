[project]
name = "eflesh-unified"
version = "1.0.0"
description = "Unified data collector for eFlesh magnetic array + LoadScale force sensor"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "PyQt6>=6.5",
    "matplotlib>=3.8",
    "scikit-learn>=1.7.2",
    "pandas>=2.3.3",
    "joblib>=1.5.3",
]

[tool.uv.workspace]
members = ["MagneticSensors", "LoadScale"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
