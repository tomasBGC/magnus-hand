[project]
name = "eflesh-gui"
version = "1.0.0"
description = "Real-time GUI for visualizing 4 groups of 5 MLX90393 magnetometers"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "pyqtgraph>=0.13",
    "PyQt6>=6.5",
    "numpy>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Pin to specific Python if desired:
# managed = true
# python-preference = "only-managed"
