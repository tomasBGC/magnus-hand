; PlatformIO Configuration for eFlesh 4×5 Multiplexed Sensor Array
; Board: Teensy 4.0 with TCA9546A I2C multiplexer
[platformio]
build_dir = C:/venvsEtc/.efleshmulti
libdeps_dir = C:/venvsEtc/.efleshmulti/libdeps


[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 2000000


; Teensy 4.0 runs at 600 MHz by default — fast enough for 20-sensor streaming
board_build.f_cpu = 600000000L

; USB type: Serial
build_flags =
    -D USB_SERIAL

